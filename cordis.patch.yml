# Package bundle layer for plugin-micro.
#
# `dsh plugin --profile <name> add plugin-micro` appends this package
# to `dsh.profile.bundles`, and this insert is applied after the base bundles.
# A user profile can still address the row by id to override its config:
#
#   - id: codex-micro
#     name: plugin-micro
#     config: { autoConnect: false, brightness: 0.6, autoOffMs: 600000 }
- insert:
    - id: codex-micro
      name: plugin-micro
      config:
        autoConnect: true
        brightness: 1
        autoOffMs: 0
